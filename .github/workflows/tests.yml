name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      # Solo tests unitarios (httpx.MockTransport, sin red). smoke_test.py
      # toca la API real de Mercadona a proposito y no se ejecuta aqui: no
      # tiene sentido pegarle en cada push/PR (rate limits, ToS, ademas de
      # que requeriria credenciales de una cuenta real como secreto de CI).
      - name: Run unit tests
        run: pytest tests/ -q
