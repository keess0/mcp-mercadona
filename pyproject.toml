[project]
name = "mercadona-mcp"
version = "0.1.0"
description = "Servidor MCP no oficial para tienda.mercadona.es: catalogo, carrito y pedidos"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
mercadona-mcp = "mercadona_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mercadona_mcp"]
